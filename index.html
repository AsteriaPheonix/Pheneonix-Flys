<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAGJ7_mn5R8wdQInyzk5NQVRlvGFFtCKiM",
        authDomain: "asteria-pad.firebaseapp.com",
        databaseURL: "https://asteria-pad-default-rtdb.firebaseio.com",
        projectId: "asteria-pad",
        storageBucket: "asteria-pad.firebasestorage.app",
        messagingSenderId: "281179870896",
        appId: "1:281179870896:web:ceb21e6de9a3bf9dd94d75"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let isIgnited = false;
    let currentTab = "monthly"; 
    let currentYear = "2026";
    let currentMonth = "06"; 
    let currentWeek = "1"; 
    
    let selectedDailyDay = "01";
    let selectedDailyWeek = "DOMINGO";
    
    const tempMemoryStates = {};

    function createEmptyPlannerStructure() {
        return {
            orbitStates: {},
            calendarInputs: {},
            textAreas: { quest: "", milestones: "" },
            weeklyData: {
                "1": { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" },
                "2": { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" },
                "3": { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" },
                "4": { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" },
                "5": { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" }
            },
            matrixDailyData: {} 
        };
    }

    function createEmptyDailyObject() {
        return { chant: "", journal: "" };
    }

    let plannerData = createEmptyPlannerStructure();

    function updateAutoWeekday() {
        const yearInt = parseInt(currentYear);
        const monthInt = parseInt(currentMonth);
        const dayInt = parseInt(selectedDailyDay);
        
        const dayNames = ["DOMINGO", "LUNES", "MARTES", "MIÉRCOLES", "JUEVES", "VIERNES", "SÁBADO"];
        const dateObj = new Date(yearInt, monthInt - 1, dayInt);
        
        selectedDailyWeek = dayNames[dateObj.getDay()];
        const displayEl = document.getElementById('daily-weekday-display');
        if (displayEl) {
            displayEl.innerText = selectedDailyWeek;
        }
    }

    window.switchTab = function(id) {
        currentTab = id; 
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        
        const activeBtn = document.getElementById(`btn-tab-${id}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        window.saveData();
    }

    window.switchWeek = function(weekNum) {
        currentWeek = weekNum;
        document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
        const activeWeekBtn = document.getElementById(`btn-week-${weekNum}`);
        if (activeWeekBtn) activeWeekBtn.classList.add('active');
        
        loadWeeklyOnly();
    }

    window.switchDailySlot = function() {
        selectedDailyDay = document.getElementById('daily-day-select').value;
        updateAutoWeekday(); 
        loadDailyOnly();
        window.saveData();
    }

    window.saveData = function() {
        plannerData.textAreas['quest'] = document.getElementById('text-quest').value;
        plannerData.textAreas['milestones'] = document.getElementById('text-milestones').value;
        
        const matrixKey = `${selectedDailyDay}`;
        if(!plannerData.matrixDailyData[matrixKey]) {
            plannerData.matrixDailyData[matrixKey] = createEmptyDailyObject();
        }
        plannerData.matrixDailyData[matrixKey].journal = document.getElementById('text-daily-journal').value;
        
        if (!plannerData.weeklyData[currentWeek]) {
            plannerData.weeklyData[currentWeek] = { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" };
        }
        plannerData.weeklyData[currentWeek].quests = document.getElementById('text-weekly-quests').value;

        const routineRows = document.querySelectorAll('[data-routine]');
        routineRows.forEach(row => {
            const routineKey = row.dataset.routine;
            const activeIndices = [];
            const dots = row.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                if (dot.classList.contains('active')) {
                    activeIndices.push(index);
                }
            });
            if (!plannerData.weeklyData[currentWeek].routines) {
                plannerData.weeklyData[currentWeek].routines = {};
            }
            plannerData.weeklyData[currentWeek].routines[routineKey] = activeIndices;
        });

        const daysInMonth = new Date(parseInt(currentYear), parseInt(currentMonth), 0).getDate();
        for(let i=1; i<=daysInMonth; i++) {
            const inp = document.getElementById(`cal-input-${i}`);
            if(inp) plannerData.calendarInputs[i] = inp.value;
        }

        localStorage.setItem(`asteria_save_${currentYear}_${currentMonth}`, JSON.stringify(plannerData));
        localStorage.setItem('asteria_last_year', currentYear);
        localStorage.setItem('asteria_last_month', currentMonth);
        localStorage.setItem('asteria_last_d_day', selectedDailyDay);
        localStorage.setItem('asteria_last_tab', currentTab);
        localStorage.setItem('asteria_last_week', currentWeek);

        // Firebase 저장 시 월 키값 앞에 m_ 접두사 추가 (10월, 11월 등의 숫자인식 오류 방지)
        set(ref(db, `asteria_save/${currentYear}/m_${currentMonth}`), plannerData);
    }

    function updateCoreText() {
        const core = document.getElementById('master-core');
        if (!core) return;
        if (isIgnited) {
            core.innerText = "REBIRTH";
            core.classList.add('ignited-core');
            return;
        }

        let hasFlame = false;
        for (let key in plannerData.orbitStates) {
            if (parseInt(plannerData.orbitStates[key]) > 0) {
                hasFlame = true;
                break;
            }
        }

        if (hasFlame) {
            core.innerText = "REBIRTH";
            core.classList.add('ignited-core');
        } else {
            core.innerText = "Σποδός";
            core.classList.remove('ignited-core');
        }
    }

    function clearUI() {
        document.getElementById('text-quest').value = "";
        document.getElementById('text-milestones').value = "";
        document.getElementById('text-weekly-quests').value = "";
        document.getElementById('text-daily-journal').value = "";
        const calBox = document.getElementById('calendar-box');
        if(calBox) {
            calBox.querySelectorAll('.cell-input').forEach(i => i.value = "");
        }
        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('selected'));
    }

    function loadWeeklyOnly() {
        if (!plannerData.weeklyData[currentWeek]) {
            plannerData.weeklyData[currentWeek] = { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" };
        }
        const wData = plannerData.weeklyData[currentWeek];
        document.getElementById('text-weekly-quests').value = wData.quests || "";
        
        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        if (wData.routines) {
            for(let key in wData.routines) {
                const row = document.querySelector(`[data-routine="${key}"]`);
                if(row) {
                    const dots = row.querySelectorAll('.dot');
                    const indices = wData.routines[key] || [];
                    indices.forEach(idx => {
                        if(dots[idx]) dots[idx].classList.add('active');
                    });
                }
            }
        }
    }

    function loadDailyOnly() {
        document.getElementById('text-daily-journal').value = "";
        document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('selected'));

        const matrixKey = `${selectedDailyDay}`;
        const dData = plannerData.matrixDailyData[matrixKey] || createEmptyDailyObject();
        document.getElementById('text-daily-journal').value = dData.journal || "";
        
        if(dData.chant) {
            const targetBtn = document.getElementById(`btn-chant-${dData.chant}`);
            if(targetBtn) targetBtn.classList.add('selected');
        }
    }

    function rebuildOrbitCircle() {
        const orbit = document.getElementById('orbit-circle');
        if (!orbit) return;
        orbit.querySelectorAll('.orbit-node').forEach(n => n.remove());

        const daysInMonth = new Date(parseInt(currentYear), parseInt(currentMonth), 0).getDate();
        const radius = 110; 

        for (let i = 1; i <= daysInMonth; i++) {
            const node = document.createElement('div');
            node.className = 'orbit-node';
            node.innerText = i;
            node.id = `orbit-node-${i}`;
            node.dataset.state = "0";

            const angle = (i - 1) * (360 / daysInMonth) - 90;
            const radians = angle * (Math.PI / 180);
            
            const x = Math.round(radius * Math.cos(radians)) + 130 - 11;
            const y = Math.round(radius * Math.sin(radians)) + 130 - 11;

            node.style.left = `${x}px`;
            node.style.top = `${y}px`;

            node.addEventListener('click', function() {
                if (isIgnited) return; 
                let s = parseInt(this.dataset.state);
                this.classList.remove(`state-${s}`);
                s = (s + 1) % 4;
                this.dataset.state = s;
                if(s > 0) this.classList.add(`state-${s}`);
                
                plannerData.orbitStates[this.innerText] = s;
                syncCalendarCell(this.innerText, s);
                window.saveData();
                updateCoreText();
            });

            orbit.appendChild(node);
        }

        const daySelect = document.getElementById('daily-day-select');
        if (daySelect) {
            const prevValue = daySelect.value || selectedDailyDay;
            daySelect.innerHTML = "";
            for(let i=1; i<=daysInMonth; i++) {
                const opt = document.createElement('option');
                const txt = i < 10 ? '0' + i : i;
                opt.value = txt;
                opt.innerText = `DÍA ${txt}`;
                daySelect.appendChild(opt);
            }
            if(parseInt(prevValue) <= daysInMonth) {
                daySelect.value = prevValue;
                selectedDailyDay = prevValue;
            } else {
                daySelect.value = "01";
                selectedDailyDay = "01";
            }
        }
    }

    function rebuildCalendarGrid() {
        const cal = document.getElementById('calendar-box');
        if (!cal) return;
        cal.innerHTML = ""; 

        const dayNames = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
        dayNames.forEach(name => {
            const headerCell = document.createElement('div');
            headerCell.className = 'calendar-day-header';
            headerCell.innerText = name;
            cal.appendChild(headerCell);
        });

        const yearInt = parseInt(currentYear);
        const monthInt = parseInt(currentMonth);
        
        const firstDayIndex = new Date(yearInt, monthInt - 1, 1).getDay(); 
        const daysInMonth = new Date(yearInt, monthInt, 0).getDate(); 

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-cell empty-cell';
            cal.appendChild(emptyCell);
        }

        for (let i = 1; i <= daysInMonth; i++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-cell';
            cell.id = `cal-cell-${i}`;
            
            const num = document.createElement('span');
            num.className = 'day-num';
            num.innerText = i < 10 ? '0' + i : i;
            
            const input = document.createElement('input');
            input.className = 'cell-input';
            input.id = `cal-input-${i}`;
            input.type = 'text';
            input.placeholder = '...';
            input.addEventListener('input', window.saveData);
            
            cell.appendChild(num);
            cell.appendChild(input);
            cal.appendChild(cell);
        }
    }

    window.loadData = async function() {
        clearUI();
        rebuildOrbitCircle(); 
        rebuildCalendarGrid(); 

        const dbRef = ref(db);
        let savedData = null;

        try {
            // Firebase 로드 시에도 m_ 접두사 사용
            const snapshot = await get(child(dbRef, `asteria_save/${currentYear}/m_${currentMonth}`));
            if (snapshot.exists()) {
                savedData = snapshot.val();
            }
        } catch (error) {
            console.error("Firebase 로드 실패:", error);
        }

        if (!savedData) {
            const saved = localStorage.getItem(`asteria_save_${currentYear}_${currentMonth}`);
            if(saved) savedData = JSON.parse(saved);
        }

        if(!savedData) {
            plannerData = createEmptyPlannerStructure();
            const daySelect = document.getElementById('daily-day-select');
            if(daySelect) daySelect.value = selectedDailyDay;
            updateAutoWeekday();
            loadDailyOnly();
            updateCoreText();
            return;
        }
        
        plannerData = savedData;

        if(!plannerData.matrixDailyData) {
            plannerData.matrixDailyData = {};
        }

        document.getElementById('text-quest').value = plannerData.textAreas['quest'] || "";
        document.getElementById('text-milestones').value = plannerData.textAreas['milestones'] || "";

        document.querySelectorAll('.orbit-node').forEach(node => {
            const day = node.innerText;
            const state = plannerData.orbitStates[day] || "0";
            node.dataset.state = state;
            node.classList.remove('state-1', 'state-2', 'state-3');
            if(parseInt(state) > 0) node.classList.add(`state-${state}`);
            syncCalendarCell(day, state);
        });

        const daysInMonth = new Date(parseInt(currentYear), parseInt(currentMonth), 0).getDate();
        for(let i=1; i<=daysInMonth; i++) {
            const inp = document.getElementById(`cal-input-${i}`);
            if(inp && plannerData.calendarInputs[i]) inp.value = plannerData.calendarInputs[i];
        }

        const daySelect = document.getElementById('daily-day-select');
        if(daySelect) daySelect.value = selectedDailyDay;
        updateAutoWeekday();
        
        loadDailyOnly();
        loadWeeklyOnly();
        updateCoreText();
    }

    window.changeTimelineCycle = function() {
        isIgnited = false;
        currentYear = document.getElementById('global-year-select').value;
        currentMonth = document.getElementById('global-month-select').value;
        selectedDailyDay = "01";
        window.loadData();
    }

    window.toggleDot = function(el, idx) {
        el.classList.toggle('active');
        
        const row = el.closest('[data-routine]');
        if (row) {
            const key = row.dataset.routine;
            if (!plannerData.weeklyData[currentWeek]) {
                plannerData.weeklyData[currentWeek] = { routines: { hearth: [], chiron: [], embers: [], phoenix: [] }, quests: "" };
            }
            if (!plannerData.weeklyData[currentWeek].routines) {
                plannerData.weeklyData[currentWeek].routines = { hearth: [], chiron: [], embers: [], phoenix: [] };
            }
            
            const activeIndices = [];
            row.querySelectorAll('.dot').forEach((d, i) => {
                if (d.classList.contains('active')) {
                    activeIndices.push(i);
                }
            });
            plannerData.weeklyData[currentWeek].routines[key] = activeIndices;
        }
        window.saveData();
    }

    window.selectState = function(el) {
        document.querySelectorAll('.state-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        
        const matrixKey = `${selectedDailyDay}`;
        if(!plannerData.matrixDailyData[matrixKey]) {
            plannerData.matrixDailyData[matrixKey] = createEmptyDailyObject();
        }
        plannerData.matrixDailyData[matrixKey].chant = el.dataset.val;
        window.saveData();
    }

    function syncCalendarCell(dayNum, state) {
        const cell = document.getElementById(`cal-cell-${dayNum}`);
        if (!cell) return;
        cell.classList.remove('cell-state-1', 'cell-state-2', 'cell-state-3');
        if (parseInt(state) > 0) cell.classList.add(`cell-state-${state}`);
    }

    window.triggerIgnition = function() {
        const nodes = document.querySelectorAll('.orbit-node');
        
        if (!isIgnited) {
            nodes.forEach(node => {
                tempMemoryStates[node.innerText] = node.dataset.state;
                node.classList.remove('state-1', 'state-2', 'state-3');
                node.classList.add('state-3');
                syncCalendarCell(node.innerText, 3);
            });
            isIgnited = true;
        } else {
            nodes.forEach(node => {
                node.classList.remove('state-1', 'state-2', 'state-3');
                const originalState = tempMemoryStates[node.innerText] || "0";
                node.dataset.state = originalState;
                if (parseInt(originalState) > 0) node.classList.add(`state-${originalState}`);
                syncCalendarCell(node.innerText, originalState);
            });
            isIgnited = false;
        }
        updateCoreText();
    }

    window.returnToAshes = function() {
        if(confirm("정말 모든 기록을 태워버리고 잿더미(RESET)로 회귀하시겠습니까? 현재 주기의 세이브가 완전히 연소됩니다.")) {
            if (currentTab === "monthly") {
                plannerData.orbitStates = {};
                plannerData.calendarInputs = {};
                plannerData.textAreas['quest'] = "";
                plannerData.textAreas['milestones'] = "";
            } else if (currentTab === "weekly") {
                plannerData.weeklyData[currentWeek] = {
                    routines: { hearth: [], chiron: [], embers: [], phoenix: [] },
                    quests: ""
                };
            } else if (currentTab === "daily") {
                const matrixKey = `${selectedDailyDay}`;
                plannerData.matrixDailyData[matrixKey] = createEmptyDailyObject();
            }

            localStorage.setItem(`asteria_save_${currentYear}_${currentMonth}`, JSON.stringify(plannerData));
            set(ref(db, `asteria_save/${currentYear}/m_${currentMonth}`), plannerData);
            window.loadData();
        }
    }

    async function init() {
        const lastY = localStorage.getItem('asteria_last_year');
        const lastM = localStorage.getItem('asteria_last_month');
        const lastDD = localStorage.getItem('asteria_last_d_day');
        const lastTab = localStorage.getItem('asteria_last_tab');
        const lastWeek = localStorage.getItem('asteria_last_week');
        
        if(lastY && lastM) {
            currentYear = lastY;
            currentMonth = lastM;
            const ySel = document.getElementById('global-year-select');
            const mSel = document.getElementById('global-month-select');
            if(ySel) ySel.value = lastY;
            if(mSel) mSel.value = lastM;
        }
        if(lastDD) {
            selectedDailyDay = lastDD;
        }
        
        await window.loadData(); 

        if(lastTab) {
            window.switchTab(lastTab);
        }
        if(lastWeek) {
            window.switchWeek(lastWeek);
        }
    }

    init();
</script>
